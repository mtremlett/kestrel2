[project]
name = "kestrel2"
version = "0.1.0"
description = "A small, verifiable quant desk for one retail trader. Paper and backtest only."
requires-python = ">=3.11,<3.13"
dependencies = []  # the declared environment has ONE home: requirements.txt

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # import order
  "UP",         # modern python
  "B",          # bugbear
  "C90",        # complexity
  "ANN",        # missing annotations
  "S",          # security
  "BLE",        # blind except
  "ERA",        # commented-out code
  "T20",        # stray print
  "PTH",        # pathlib over os.path
  "RET", "SIM", "ARG",
]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20"]
"check.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["desk", "lab", "tests", "check.py", "announce.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = ["scene: an end-to-end north-star scene (slow)"]
