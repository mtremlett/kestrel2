name: check

# THE CHECK RUNS HERE, NOT ONLY ON THE OPERATOR'S PC. This machine has no access to his
# data, his broker or his files - which is exactly why a test cannot quietly start
# depending on live state and call itself green.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Two pushes to one branch: the older run gives way (never on main, whose run announces).
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  step:
    # THE ONE CHECK, ITS STEPS SIDE BY SIDE: each runs `python check.py --only <step>`, the
    # unit tests in three shares. tests/guards/test_workflow.py holds this list to check.py's.
    name: step (${{ matrix.step }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - step: format
          - step: lint
          - step: guards
          - step: types
          - step: unit
            shard: 1/3
          - step: unit
            shard: 2/3
          - step: unit
            shard: 3/3
          - step: scenes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install the declared environment
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: one step of the one check
        run: python check.py --only ${{ matrix.step }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

  check:
    # The required check: green only when every step above passed. Skipped, cancelled or
    # failed is red; nothing here can be green by default.
    needs: step
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every step passed
        run: test "${{ needs.step.result }}" = "success"

  announce:
    # ONE LINE TO THE OPERATOR'S TELEGRAM for each change that lands on main, once the
    # check has passed there. The key and chat id are secrets he set himself; a missing
    # one turns this job red, it never skips. docs/DECISIONS.md, 13 November 2026.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: send the operator one line
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python announce.py

  guards-cannot-be-loosened:
    # A change to a guard, a budget or the manifest is allowed, but it is never quiet:
    # this job states it in the pull request so the operator sees it before merging.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: say whether this change touches a guard
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          guards=$(echo "$changed" | grep -E '^(BUDGET.json|manifest.toml|pyproject.toml|check.py|tests/guards/|\.github/)' || true)
          if [ -n "$guards" ]; then
            echo "::warning title=This change touches a guard::$guards"
            echo "THIS CHANGE TOUCHES A GUARD - the operator approves it or it does not merge:"
            echo "$guards"
          else
            echo "No guard touched."
          fi
