# THE MANIFEST - every module, its one job, and what it may import.
#
# A .py file under desk/ or lab/ that is not listed here FAILS the check, so a new
# module is registered on purpose before it is written. This is the wall that the
# old desk never had: its trading run could reach 352,000 lines of anything.
#
# THE WALL, in one line each:
#   desk/  the trading core. Imports the standard library and its allowed third
#          party list ONLY. It may never import lab/.
#   lab/   research and the ladder. May import desk/ (it tests the real thing).

[packages.desk]
purpose = "the trading core: data in, decisions out, orders to one broker door"
may_import = ["stdlib"]
allowed_third_party = []

[packages.lab]
purpose = "research and the ladder: judges strategies using the core's own code"
may_import = ["stdlib", "desk"]
allowed_third_party = ["numpy"]  # his ruling, 13 November: research only; desk/ stays stdlib

# Each lane's files beyond its modules (listed under its heading below) and their unit
# tests. tests/guards/test_lanes.py refuses a lane branch that changes any other file,
# apart from the shared documents. Changing this table is changing a guard.
[lanes]
money = ["tests/scenes/test_scenes.py"]
paper = []
data = ["tests/scenes/rehearsal.py"]
grid = []
rungs = []

# Every module, with the one thing it owns. Add a line here, then write the file.
# Each lane (docs/PLAN.md) adds its modules under its own heading, so two lanes never
# edit the same lines of this file.
[modules]
"desk/__init__.py" = "the package marker; owns no behaviour"
"lab/__init__.py" = "the package marker; owns no behaviour"

# the data lane
"desk/lines.py" = "the instrument master: the facts about each line"
"desk/venues.py" = "the one calendar: the days each venue trades, its own holidays and no other's"
"desk/archive.py" = "the one client for the free price archive: a line's daily bars, checked on entry"
"desk/store.py" = "the one price store and its one writer: bars cleaned on entry, bad lines parked"
"desk/bars.py" = "the one fast store for hot and deep bars: one SQLite file, the one writer's whole rounds, many readers"
"lab/universe.py" = "the research list: the tickers research may study, none of them traded, and their bars kept by the one store"
"lab/members.py" = "the lists' past members: who was on a published list on a past day, the ones still listed told from the ones that left"
"lab/headstart.py" = "the old desk's stores as a head start: its five-minute bars read, never written, and let into the one fast store under their source's name only where a fresh daily bar vouches for them"

# the money lane
"desk/strategy.py" = "the five frozen daily strategies: a decision for every line and day"
"desk/orders.py" = "the order, sized from the one capital number, its stop, the pre-trade gate"
"desk/broker.py" = "the pretend broker the desk trades against in simulation"
"desk/book.py" = "the ledger of fills under the broker's ids, and the book built from the broker"
"desk/day.py" = "the desk's day: run once for a date, publish one record, replay it"
"desk/kill.py" = "the kill switch: one command stops every new order and cancels the working ones, the desk says so, and its drill"
"desk/emergency.py" = "the three emergencies in numbers: an emergency, a crash and a black swan, each a measured fall set in advance, each with its action"
"desk/halt.py" = "what stops the desk buying: the halt, a typed record in force until it is lifted and said every day, and the blockers, every one named, with each morning's list of the signals each blocked"
"desk/simcity.py" = "SimCity, small: one command lives the desk's whole day over all the saved data at the pretend broker with its faults and writes the night's one record, with the census of the money path's parts and the scenarios that ran them"

# the paper lane
"desk/paper.py" = "the one door to the paper broker: the paper account's holdings and resting orders, read and set against the desk's book"
"desk/listing.py" = "each line as the paper broker knows it: its contract there, its exchange, the unit of its prices and its price steps, asked through the one door"
"desk/reports.py" = "what the paper broker reports was done: the day's fills on the account, each of the desk's own under the broker's id and priced in its line's currency, and the desk's own fills, orders and stops told from anyone else's"
"desk/gateway.py" = "the gateway's own week, known before any order: whether it is ready, its daily restart waited out, a gateway from which nothing comes back the operator's to look at, and his weekly login's reminder"
"desk/clearance.py" = "the day's check and no order without it: the paper account against the desk's book, the desk's own resting stops told from anyone else's orders, each check on a dated record, and the refusal to send until that day's check is clean"
"desk/placing.py" = "the paper account behind the send path: what the desk asks of any broker answered through the one door, its fills, holdings, stops and what it did with an order, and the kill switch's cancel of the desk's own working orders; placing itself is not built"
"desk/messenger.py" = "the desk's one voice: every message to the operator through one door and onto one delivery record, each delivered once under its name; the morning and the evening message of a trading day, his weekly login's reminder, and the alarm when a daily message is not delivered by its hour"
"desk/running.py" = "the desk unattended: one step that does what the desk owes at its moment, once, from its records alone (the day's check, each venue's orders, the day's record, what he is told), and what a desk that died part-way left at the broker put right"

# the grid lane
"lab/cell.py" = "the ladder's unit of work: one strategy on one line over one window, keyed by the code's and the data's versions"
"lab/batch.py" = "the ladder's batch service: runs many cells, records a bad one and carries on, and takes up where a stopped run left off"
"lab/grid.py" = "the fast grid engine: each strategy's position after every bar, on whole arrays; it matches the desk's own decisions or refuses"
"lab/tune.py" = "the pass's auto-tune: the memory ceiling Windows holds on the workers, their number sized to the free cores and backed off under load, each pass's peaks logged"
"lab/sweep.py" = "the grid's pass: every strategy at every setting on every ticker of a list, a ticker to a worker under the auto-tune, each cell kept by its code and its bars"

# the rungs lane
"lab/rung.py" = "the ladder's first rung: a cell's trades priced at the desk's fills and the broker's costs, and judged against chance"
"lab/luck.py" = "the ladder's luck rung: every trial counted, and each verdict's chance corrected for the number of trials it was picked from"
"lab/folds.py" = "the ladder's folds rung: a history cut into folds, each judged after costs beside the history before it, and the verdict given on the worst"
"lab/deflated.py" = "the luck test fixed before any result: the deflated Sharpe and its bands, the yearly Sharpe too good to be true, and the one verdict rule over the named rungs"
"lab/trials.py" = "the register of trials: every trial ever tried on a question, kept from batch to batch, and the luck rung's count taken from it"
"lab/plateau.py" = "plateaus over peaks: of a rule's many settings, the centre of a plateau of passing neighbours chosen, and a lone peak never promoted"
"lab/published.py" = "the published rules: each rule's source and known answers, and the refusal of code that does not give them"
"lab/reproduce.py" = "the author's own result: a published rule run on its author's market and period, counted as the author counted, and set beside the figure the author printed"
"lab/promotion.py" = "before paper and after it: a candidate only with the ladder's pass and its kill condition written first, and promoted only on thirty effective paper trades, net positive"
"lab/regime.py" = "periods and regimes: a strategy replayed in each period and each regime of the weather, kept for the regimes it earns in, and its trades outside them tagged"
"lab/stress.py" = "the stress scenarios: a strategy's trades taken through the flash crashes and the 2020 crash, and what a black swan's overnight gap would cost it at its leverage, in pounds and never a pass"
"lab/market.py" = "the market's rung: a strategy's days set beside its market's, its beta measured, and its excess over the market risk it took judged by its confidence interval"
"lab/bets.py" = "the book's concentration: its number of independent bets from how its lines move together, and its profit split by correlated cluster"
