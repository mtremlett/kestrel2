# THE MANIFEST - every module, its one job, and what it may import.
#
# A .py file under desk/ or lab/ that is not listed here FAILS the check, so a new
# module is registered on purpose before it is written. This is the wall that the
# old desk never had: its trading run could reach 352,000 lines of anything.
#
# THE WALL, in one line each:
#   desk/  the trading core. Imports the standard library and its allowed third
#          party list ONLY. It may never import lab/.
#   lab/   research and the ladder. May import desk/ (it tests the real thing).

[packages.desk]
purpose = "the trading core: data in, decisions out, orders to one broker door"
may_import = ["stdlib"]
allowed_third_party = []

[packages.lab]
purpose = "research and the ladder: judges strategies using the core's own code"
may_import = ["stdlib", "desk"]
allowed_third_party = ["numpy", "pyarrow"]  # his rulings, 13 and 14 November: research only; desk/ stays stdlib

# Each lane's files beyond its modules (listed under its heading below) and their unit
# tests. tests/guards/test_lanes.py refuses a lane branch that changes any other file,
# apart from the shared documents. Changing this table is changing a guard.
[lanes]
money = ["tests/scenes/test_scenes.py"]
paper = []
data = ["tests/scenes/rehearsal.py"]
grid = []
rungs = ["lab/catalogue.toml", "tests/unit/test_lab_catalogue.py"]

# Every module, with the one thing it owns. Add a line here, then write the file.
# Each lane (docs/PLAN.md) adds its modules under its own heading, so two lanes never
# edit the same lines of this file.
[modules]
"desk/__init__.py" = "the package marker; owns no behaviour"
"lab/__init__.py" = "the package marker; owns no behaviour"

# the data lane
"desk/lines.py" = "the instrument master: the facts about each line"
"desk/venues.py" = "the one calendar: the days each venue trades, its own holidays and no other's"
"desk/archive.py" = "the one client for the free price archive: a line's daily bars, checked on entry"
"desk/history.py" = "the one client for the broker's historical bars: a line's daily bars asked of the paper gateway read-only as its own client, paced inside the broker's limit, never in a desk round"
"desk/rollup.py" = "the one builder of the coarser intraday timeframes from the finest bars: session-aligned per venue, no bar across a session break, a partial interval never written, each bar marked rollup:<from>"
"desk/store.py" = "the one price store and its one writer: bars cleaned on entry, bad lines parked"
"desk/bars.py" = "the one fast store for hot and deep bars: one SQLite file, the one writer's whole rounds, many readers"
"desk/spans.py" = "the timeframes: one Span for each of 1m, 2m, 5m, 10m, 15m, 30m, 1h, 4h, 1d and 1wk with its length and start rule (a bar starts on a whole multiple of its length in UTC), and the bar types that refuse an off-mark start"
"desk/audit.py" = "the store's read-only audit: every line the two databases hold re-checked through the checks that let its bars in, counts and faults by kind in one line"
"desk/compare.py" = "how an old store's bars meet the bars the store holds: agreeing, the adjusted form of the raw as-traded bar (a factor, never written over it), or a real disagreement counted by day"
"desk/snapshot.py" = "the nightly backup copy: one consistent snapshot of each price database and the ledger in the data folder's backup folder, the last few kept"
"lab/universe.py" = "the research list: the tickers research may study, none of them traded, and their bars kept by the one store"
"lab/universe_history.py" = "the research bars in the history database: the research store's CSV bars and the ladder's pound table let in through the one writer, each bar under its source, only on days the database holds none"
"lab/members.py" = "the lists' past members: who was on a published list on a past day, the ones still listed told from the ones that left"
"desk/collector.py" = "the free collector: once a day the free vendors' price second opinions, macro series, earnings dates and timestamped news, each answer kept raw and its facts in the one store"
"desk/keeper.py" = "the store's keeper: one command that does whatever the store is owed when it is called, each venue's daily bars refreshed from the archive and its five-minute round taken in its hours, and the door the daily bars are read through"
"desk/live.py" = "the live session's only source of bars: a line's newest ended five-minute bars from the paper gateway, read-only as its own client, paced; no real-time data is a loud refusal, never a fill from the archive"
"lab/headstart.py" = "the old desk's stores as a head start: its five-minute bars read, never written, and let into the one fast store under their source's name only where a fresh daily bar vouches for them"
"lab/headstart_days.py" = "the old database's daily rows as a head start: only its table ohlcv's 1d rows, read-only, cleaned by the one store and let into the fast store under their own source on the days that hold no bar"
"lab/headstart_hours.py" = "the old Stooq store's hourly bars as a head start: read-only, each named by its start in UTC, vouched for by its day, cleaned by the one store and let into the history database under their own source"
"lab/headstart_matrix.py" = "the old Stooq matrices' 15-minute, 30-minute and hourly arrays as a head start: read-only, named by their start in UTC, vouched for by their day, cleaned by the one store and let into the two databases under their own source"

# the money lane
"lab/slippage.py" = "trading costs measured from the paper broker's real fills: each line's slip against the session's close beside the cost model's spread and slippage, and the gap (Q2)"
"desk/strategy.py" = "the five frozen daily strategies: a decision for every line and day"
"desk/eponymous_momentum.py" = "Antonacci's dual momentum, absolute leg, one rule under the strategy template: held while the last month-end close beats the one a year before; not traded by the paper desk"
"desk/eponymous_swing.py" = "the eponymous rules, one published rule per author under the strategy template: weekly_reversal_jegadeesh; the paper desk does not trade them"
"desk/eponymous_connors.py" = "Connors' RSI-2 as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_bollinger_squeeze.py" = "Bollinger's band squeeze as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_faber_tactical.py" = "Faber's 10-month trend rule as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_kell_breakout.py" = "Oliver Kell's base-and-break as a rule under the one template, with its author, secondary source and the range of its setting; not traded by the paper desk"
"desk/eponymous_zweig_breadth_thrust.py" = "Martin Zweig's breadth thrust as a rule under the one template, author, secondary source and published figure written down, BLOCKED ON DATA (no breadth store); not traded by the paper desk"
"desk/eponymous_connors_three_day_high_low.py" = "Connors and Alvarez's three-day high/low rule as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_demark_sequential.py" = "Tom DeMark's TD Sequential as a rule under the one template, with its author, source and the range of its setting; not traded by the paper desk"
"desk/eponymous_williams_r.py" = "Larry Williams's %R as a rule under the one template, with its author, source and published setting range; not traded by the paper desk"
"desk/eponymous_clenow_momentum.py" = "Clenow's momentum rule (Stocks on the Move) as a rule under the one template, author, source and published figure written down; not traded by the paper desk"
"desk/eponymous_keltner_channel_trend.py" = "Keltner's channel trend rule (How to Make Money in Commodities) as a rule under the one template, author, source and published figure written down; not traded by the paper desk"
"desk/eponymous_raschke_swing.py" = "Linda Raschke's Turtle Soup (Street Smarts) as a rule under the one template, with its author, source and the range of its setting; not traded by the paper desk"
"desk/eponymous_mansfield_rs_momentum.py" = "Mansfield's relative-strength rule (Weinstein) as a rule under the one template, measured against the SPY line, author, secondary source and published figure written down; not traded by the paper desk"
"desk/risk.py" = "where the book stands against its loss and order-rate limits: the losses so far today and this week and the new lines entered today, and which loss limit has been reached; the limits themselves are in orders.Settings"
"desk/orders.py" = "the order, sized from the one capital number, its stop, the pre-trade gate"
"desk/broker.py" = "the pretend broker the desk trades against in simulation"
"desk/book.py" = "the ledger of fills under the broker's ids, and the book built from the broker"
"desk/book_parts.py" = "the ledger's lower parts: the one keeper of dated records, the kill switch's record and the day's pounds per currency; desk.book gives them to its callers"
"desk/book_diff.py" = "the book against a broker: the one comparison of the book with a broker's holdings or resting stops, and the Difference it names; desk.book gives both to its callers"
"desk/carry.py" = "the pound's rate on a day London is shut and the US trades: the last London session's carried over, at most three US sessions"
"desk/eponymous_bands.py" = "the eponymous channel rules (Donchian's four-week breakout), each a rule under the strategy template, authors and sources written down; the paper desk does not trade them"
"desk/eponymous_minervini_breakout.py" = "Minervini's breakout from a Stage 2 uptrend (his Trend Template and pivot) as a rule under the one template, author, source and setting written down; not traded by the paper desk"
"desk/eponymous_dan_zanger.py" = "Dan Zanger's heavy-volume base breakout as a rule under the one template, with its author, secondary source and published figure range; not traded by the paper desk"
"desk/eponymous_weinstein_stage.py" = "Stan Weinstein's stage analysis (price above a rising 30-week average) as a rule under the one template, author, source and range of its setting written down; not traded by the paper desk"
"desk/intraday.py" = "the one engine, intraday: a rule declares its bar span and decides on one session bar at a time; the backtest and the desk's step at a bar agree"
"desk/day.py" = "the desk's day: run once for a date, publish one record, replay it"
"desk/kill.py" = "the kill switch: one command stops every new order and cancels the working ones, the desk says so, and its drill"
"desk/emergency.py" = "the three emergencies in numbers: an emergency, a crash and a black swan, each a measured fall set in advance, each with its action"
"desk/halt.py" = "what stops the desk buying: the halt, a typed record in force until it is lifted and said every day, and the blockers, every one named, with each morning's list of the signals each blocked"
"desk/watch.py" = "the crash watch: one look every five minutes reads each trading line's newest bar, and a fall that is one of the three emergencies halts all buying at once, tells him and records why; it lifts its own halt when the market ends a day clear"
"desk/simcity.py" = "SimCity, small: one command lives the desk's whole day over all the saved data at the pretend broker with its faults and writes the night's one record, with the census of the money path's parts and the scenarios that ran them"
"desk/simcity_census.py" = "SimCity's census: each part of the money path and the scenarios that ran it, measured by a profiler"
"desk/simcitycmd.py" = "SimCity's command line: the saved store lived in a night of worlds (all with --full) as the runner asks, the night's words printed, the code 1 for a red night"
"desk/eponymous_breakouts.py" = "rules named for their authors, ported one at a time under the strategy template and judged on the ladder, never traded by the paper desk: Darvas's box"

# the paper lane
"desk/goflat.py" = "go flat, a second kill level: a flag file halts all buying and each step sells every held line through the one send path until the operator lifts it"
"desk/records_kept.py" = "the ledger and day records copied twice, each with its hashes, and a restore drilled each quarter"
"desk/paper.py" = "the one door to the paper broker: the paper account's holdings and resting orders, read and set against the desk's book"
"desk/t212.py" = "the one client for Trading 212, read-only by construction: an account's cash, holdings and order history, a fixed list of GET messages, no order or write call"
"desk/listing.py" = "each line as the paper broker knows it: its contract there, its exchange, the unit of its prices and its price steps, asked through the one door"
"desk/reports.py" = "what the paper broker reports was done: the day's fills on the account, each of the desk's own under the broker's id and priced in its line's currency, and the desk's own fills, orders and stops told from anyone else's"
"desk/gateway.py" = "the gateway's own week, known before any order: whether it is ready, its daily restart waited out, a gateway from which nothing comes back the operator's to look at, and his weekly login's reminder"
"desk/clearance.py" = "the day's check and no order without it: the paper account against the desk's book, the desk's own resting stops told from anyone else's orders, each check on a dated record, and the refusal to send until that day's check is clean"
"desk/placing.py" = "the paper account behind the send path: what the desk asks of any broker answered through the one door, its fills, holdings, stops and what it did with an order, and the kill switch's cancel of the desk's own working orders; placing itself is not built"
"desk/messenger.py" = "the desk's one voice: every message to the operator through one door and onto one delivery record, each delivered once under its name; the morning and the evening message of a trading day, his weekly login's reminder, and the alarm when a daily message is not delivered by its hour"
"desk/pnl.py" = "the hourly profit and loss for his phone: the day's profit after every cost, each holding's move and the market held simply, from the book and the five-minute bars, as a few lines of words"
"desk/running.py" = "the desk unattended: one step that does what the desk owes at its moment, once, from its records alone (the day's check, each venue's orders, the day's record, what he is told), and what a desk that died part-way left at the broker put right"
"desk/streak.py" = "FIRST-LIGHT counted by the desk itself: the run of consecutive days whose records count (a day that sent nothing never does), against the ten it takes, in a plain sentence"
"desk/supervisor.py" = "the desk's processes kept alive: one supervisor that runs each registered job when due in a process of its own, one of each at a time, a dated receipt for every run, the desk's health judged from outside by the receipts, and the ledger of what the operator did with the measure of how long the desk has run without him"
"desk/command.py" = "the desk's day as the runner asks for it: one step, the morning's pre-flight and the rehearsal of a whole day with the markets shut, each one line and a code; and the real doors a step is given, the price store's and the day's pounds per dollar"
"desk/conformance.py" = "the conformance trades as a command: one run for each market in its hours on the paper account, a rejection, a buy with its stop, a sale, a buy of the desk's size and its stop made to sell, each real result recorded beside the pretend broker's; nothing sent unless the account is quiet, and the account left as found"
"desk/conformance_soak.py" = "the conformance soak: one conformance round of one share on demand, hourly in a venue's hours, each round's order ids its own and each round, done or refused, its own line in the soak ledger"
"desk/conformance_tape.py" = "what the conformance run needs of the desk beside it: a desk round's hours, the desk's own share of the account read before a run, and a holding of the desk's found moved after it"
"desk/ended.py" = "the day's cancelled orders at the paper broker and its own words of why each ended, read-only over an open connection"

# the grid lane
"lab/cell.py" = "the ladder's unit of work: one strategy on one line over one window, keyed by the code's and the data's versions"
"lab/rulebook.py" = "the lab's one list of rules by name: the desk's five and every rule of every eponymous file, found by the folder; only the five are A-GATE candidates"
"lab/batch.py" = "the ladder's batch service: runs many cells, records a bad one and carries on, and takes up where a stopped run left off"
"lab/grid.py" = "the fast grid engine: each strategy's position after every bar, on whole arrays; it matches the desk's own decisions or refuses"
"lab/tune.py" = "the pass's auto-tune: the memory ceiling Windows holds on the workers, their number sized to the free cores and backed off under load, each pass's peaks logged"
"lab/sweep.py" = "the grid's pass: every strategy at every setting on every ticker of a list, a ticker to a worker under the auto-tune, each cell kept by its code and its bars"
"lab/transfer.py" = "the grid's transfer study: a rule's settings fitted on one line at the centre of a plateau, never a lone peak, and scored on every other line the store holds; the result labelled PRE-REVIEW"

# the rungs lane
"lab/fast.py" = "the fast engine for spec rows: a row's position after every bar from its blocks worked out on whole arrays, shared between rows of one line, held to the desk's own engine trade for trade or refusing with TooClose"
"lab/rung.py" = "the ladder's first rung: a cell's trades priced at the desk's fills and the broker's costs, and judged against chance"
"lab/rung_costs.py" = "the ladder's costs rung: the first rung's priced trades read for how much of the edge the broker's costs took, and passed only if it survives them doubled"
"lab/rung_ci.py" = "the ladder's confidence-interval rung: the mean gain of a rule's trades with its interval, judged on the whole interval above or below nothing and not on a sign"
"lab/rung_beta.py" = "the ladder's beta rung: a strategy's days regressed on its benchmark's, and its excess over the market risk it took judged on its whole interval above or below nothing and not on a sign"
"lab/luck.py" = "the ladder's luck rung: every trial counted, and each verdict's chance corrected for the number of trials it was picked from"
"lab/rung_sample.py" = "the first rung's stated false-pass rate, taken from its own bar and minimum, and the exact binomial band that many noise cells must fall in"
"lab/folds.py" = "the ladder's folds rung: a history cut into folds, each judged after costs beside the history before it, and the verdict given on the worst"
"lab/montecarlo.py" = "the ladder's Monte Carlo rung: a trial's trades resampled, seeded, into the spread of its drawdowns and returns; it measures and never gates"
"lab/rung_bootstrap.py" = "the ladder's block bootstrap rung: a tape's trades as the rule's days after costs, drawn again in blocks of days in a row, and a rule passed only while few of the redrawn histories made nothing or lost"
"lab/shuffle.py" = "the ladder's shuffle rung: the days of a line put in a random order a hundred times, and a rule that earns as much there has timed nothing"
"lab/rung_folds.py" = "the ladder's walk-forward folds rung: trades after costs cut by calendar into folds, each judged beside the history before it by the first rung's rule, and the verdict given on the worst"
"lab/rung_placebo.py" = "the ladder's block placebo: the rule run again on its line with the window's fortnights in a random order, and a rule that makes as much there timed nothing; its trades read from the tape, its answer keyed by the tape and this module's code"
"lab/deflated.py" = "the luck test fixed before any result: the deflated Sharpe and its bands, the yearly Sharpe too good to be true, and the one verdict rule over the named rungs"
"lab/trials.py" = "the register of trials: every trial ever tried on a question, kept from batch to batch, and the luck rung's count taken from it"
"lab/plateau.py" = "plateaus over peaks: of a rule's many settings, the centre of a plateau of passing neighbours chosen, and a lone peak never promoted"
"lab/variants.py" = "a row's ranged settings made into variants: every combination counted as a trial before it runs, and the centre of the best plateau reported, never a lone peak"
"lab/published.py" = "the published rules: each rule's source and known answers, and the refusal of code that does not give them"
"lab/published_case.py" = "the shape of a known answer: a rule's source and the series, or whole bars, on which it trades on stated bars and no other"
"lab/published_epon.py" = "the eponymous rules' publications: each rule's author, work and known answers, a book apart from the ladder's first set"
"lab/reproduce.py" = "the author's own result: a published rule run on its author's market and period, counted as the author counted, and set beside the figure the author printed"
"lab/promotion.py" = "before paper and after it: a candidate only with the ladder's pass and its kill condition written first, and promoted only on thirty effective paper trades, net positive"
"lab/regime.py" = "periods and regimes: a strategy replayed in each period and each regime of the weather, kept for the regimes it earns in, and its trades outside them tagged"
"lab/weather.py" = "the market weather: each session's regime named from the closes known at that session's close only; first layer, the trend state against the long average"
"lab/rung_dsr.py" = "the ladder's seventh rung: the deflated Sharpe of a trial's gains against the best that luck gives among the number of trials it was picked from and their spread, both asked of the caller and never left out; the formula and bands read from lab/deflated.py"
"lab/rung_regimes.py" = "the ladder's fifth rung: a cell's priced trades judged in two regime windows apart by the first rung's rule, and passed only when both pass; read from the tape"
"lab/stress.py" = "the stress scenarios: a strategy's trades taken through the flash crashes and the 2020 crash, and what a black swan's overnight gap would cost it at its leverage, in pounds and never a pass"
"lab/market.py" = "the market's rung: a strategy's days set beside its market's, its beta measured, and its excess over the market risk it took judged by its confidence interval"
"lab/holding.py" = "each strategy beside simply holding its market: its pounds after costs and the market held through the same window after the same costs, and the difference (Q6)"
"lab/rung_benchmark.py" = "the benchmark rung: each judged trade set beside what its benchmark made over the same days, and the rule passed only if the whole confidence interval of its excess lies above nothing; proven alone"
"lab/feasibility.py" = "before A-GATE paper: the count of ladder-passed rules (three asked) and the feasibility number, their summed net pounds a day against the A-GATE's hundred, each shortfall named"
"lab/bets.py" = "the book's concentration: its number of independent bets from how its lines move together, and its profit split by correlated cluster"
"lab/ladder.py" = "the ladder's first set: one command that takes every published rule on every line through every rung built, keeps each answer with its reason and its count of trials, skips what is kept, and ends with one line of counts"
"lab/ladder_sets.py" = "the ladder's sets as a command: set EPON, every eponymous rule on every line the store holds, judged by the cell engine of lab/ladder.py, its table written PRE-REVIEW, and the door of `python -m lab.ladder`"
"lab/history_bars.py" = "the ladder's bars from the history database alone: the lines it holds, each line's daily bars and the pound per dollar, a line it lacks named"
"lab/ladder_pool.py" = "the ladder on all the PC's cores: its cells judged in a process pool of below-normal workers, grouped by rule, the rows the serial run's rows in its order, written by the parent alone; a worker's break is that cell's row"
"lab/tape.py" = "the ladder's expensive stage, kept: a rule's trades on a line, one small file each on disk, keyed only by the rule's code, the engine's, the bars and the window, so a rung changed runs no simulation again"
"lab/rung_cpcv.py" = "the ladder's eighth rung: a tape's priced trades cut into six stretches, every two held out in turn, purged at the cuts, and the probability that the rule was overfitted to the stretches it was chosen on"
"lab/verdict.py" = "the ladder's verdict on one cell: every rung's answer with its reason, the shuffle run last and only on a trial that passed the rest, and the one rule over them"
"lab/blocks.py" = "the spec book's building blocks: entries, exits, stops and filters, each written once as a small stateful class over the desk's own proven indicators, and the one list of them by name with their parameters' ranges"
"lab/spec.py" = "a strategy as data: a row of named blocks, parameters, source and known answers, built only by Spec.parse which refuses any wrong row, and SpecRule that runs it as the desk's own Rule"
