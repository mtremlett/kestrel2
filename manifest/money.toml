# THE MONEY LANE'S MODULES - each with the one thing it owns. Only money lane
# branches edit this file, and only its module lines (tests/guards/test_lanes.py).
[modules]
"lab/slippage.py" = "trading costs measured from the paper broker's real fills: each line's slip against the session's close beside the cost model's spread and slippage, and the gap (Q2)"
"desk/strategy.py" = "the five frozen daily strategies: a decision for every line and day"
"desk/strategy_parts.py" = "the indicators under the daily strategies: the rolling window, Wilder's and the exponential average, RSI and the lower band; desk.strategy gives them to its callers"
"desk/eponymous_momentum.py" = "Antonacci's dual momentum, absolute leg, one rule under the strategy template: held while the last month-end close beats the one a year before; not traded by the paper desk"
"desk/eponymous_swing.py" = "the eponymous rules, one published rule per author under the strategy template: weekly_reversal_jegadeesh; the paper desk does not trade them"
"desk/eponymous_connors.py" = "Connors' RSI-2 as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_bollinger_squeeze.py" = "Bollinger's band squeeze as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_faber_tactical.py" = "Faber's 10-month trend rule as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_kell_breakout.py" = "Oliver Kell's base-and-break as a rule under the one template, with its author, secondary source and the range of its setting; not traded by the paper desk"
"desk/eponymous_zweig_breadth_thrust.py" = "Martin Zweig's breadth thrust as a rule under the one template, author, secondary source and published figure written down, BLOCKED ON DATA (no breadth store); not traded by the paper desk"
"desk/eponymous_connors_three_day_high_low.py" = "Connors and Alvarez's three-day high/low rule as a rule under the one template, with its author, source and published setting; not traded by the paper desk"
"desk/eponymous_demark_sequential.py" = "Tom DeMark's TD Sequential as a rule under the one template, with its author, source and the range of its setting; not traded by the paper desk"
"desk/eponymous_williams_r.py" = "Larry Williams's %R as a rule under the one template, with its author, source and published setting range; not traded by the paper desk"
"desk/eponymous_clenow_momentum.py" = "Clenow's momentum rule (Stocks on the Move) as a rule under the one template, author, source and published figure written down; not traded by the paper desk"
"desk/eponymous_keltner_channel_trend.py" = "Keltner's channel trend rule (How to Make Money in Commodities) as a rule under the one template, author, source and published figure written down; not traded by the paper desk"
"desk/eponymous_raschke_swing.py" = "Linda Raschke's Turtle Soup (Street Smarts) as a rule under the one template, with its author, source and the range of its setting; not traded by the paper desk"
"desk/eponymous_mansfield_rs_momentum.py" = "Mansfield's relative-strength rule (Weinstein) as a rule under the one template, measured against the SPY line, author, secondary source and published figure written down; not traded by the paper desk"
"desk/risk.py" = "where the book stands against its loss and order-rate limits: the losses so far today and this week and the new lines entered today, and which loss limit has been reached; the limits themselves are in orders.Settings"
"desk/orders.py" = "the order, sized from the one capital number, its stop, the pre-trade gate"
"desk/orders_parts.py" = "the order's lower part: the legs of a trade, the one cost model and the broker's schedule that prices it, and the one rounding policy; desk.orders gives them to its callers"
"desk/orders_parts2.py" = "the order gate's lower part: the refusal, the loss-limit, underlying-market and correlation checks it runs, and the daily returns the correlation check reads; desk.orders gives them to its callers"
"desk/broker.py" = "the pretend broker the desk trades against in simulation"
"desk/book.py" = "the ledger of fills under the broker's ids, and the book built from the broker"
"desk/book_parts.py" = "the ledger's lower parts: the one keeper of dated records, the kill switch's record and the day's pounds per currency; desk.book gives them to its callers"
"desk/book_parts2.py" = "the ledger file: the fills the desk has recorded under the broker's ids, read and added to, the found ones apart, and the stop levels it rested; desk.book gives them to its callers"
"desk/carry.py" = "the pound's rate on a day London is shut and the US trades: the last London session's carried over, at most three US sessions"
"desk/eponymous_bands.py" = "the eponymous channel rules (Donchian's four-week breakout), each a rule under the strategy template, authors and sources written down; the paper desk does not trade them"
"desk/eponymous_minervini_breakout.py" = "Minervini's breakout from a Stage 2 uptrend (his Trend Template and pivot) as a rule under the one template, author, source and setting written down; not traded by the paper desk"
"desk/eponymous_dan_zanger.py" = "Dan Zanger's heavy-volume base breakout as a rule under the one template, with its author, secondary source and published figure range; not traded by the paper desk"
"desk/eponymous_weinstein_stage.py" = "Stan Weinstein's stage analysis (price above a rising 30-week average) as a rule under the one template, author, source and range of its setting written down; not traded by the paper desk"
"desk/intraday.py" = "the one engine, intraday: a rule declares its bar span and decides on one session bar at a time; the backtest and the desk's step at a bar agree; and the zoo, thirty textbook rules (daily, 15- and 5-minute; Grimes's ten among the daily) kept as MACHINERY NOT EDGE on fixed lines of the master"
"desk/grimes.py" = "Adam Grimes's ten setups (AG-01 to AG-10) from the reviewed catalogue, at its defaults, long only, on the daily bar under the one engine: its shared blocks (K, ATRb, M, MX, the swings, TR, LEG, IMP, LS, DIV, CLX, CoC, PQ) worked once a bar, and its one management module MGMT; a paper MACHINERY TEST, never evidence, never a candidate"
"desk/day.py" = "the desk's day: run once for a date, publish one record, replay it"
"desk/day_money.py" = "the day's money read at its end: what the book is worth, its heat, and the pounds it controls per underlying market"
"desk/day_parts.py" = "the day's published record: its fields and verdict, and the records file that keeps it, read and written; desk.day gives them to its callers"
"desk/restop.py" = "the stop set from the fill: a held line's resting stop moved under its fill's own price, once, and the level kept"
"desk/handpark.py" = "a line parked by hand: a symbol named in a small file of the desk's data folder is never bought while listed, sold and stopped as ever (R-RUNNER-397); and the rehearsal's order-id prefix, so the book shows its fills as found, never traded"
"desk/kill.py" = "the kill switch: one command stops every new order and cancels the working ones, the desk says so, and its drill"
"desk/emergency.py" = "the three emergencies in numbers: an emergency, a crash and a black swan, each a measured fall set in advance, each with its action"
"desk/halt.py" = "what stops the desk buying: the halt, a typed record in force until it is lifted and said every day, and the blockers, every one named, with each morning's list of the signals each blocked"
"desk/watch.py" = "the crash watch: one look every five minutes reads each trading line's newest bar, and a fall that is one of the three emergencies halts all buying at once, tells him and records why; it lifts its own halt when the market ends a day clear"
"desk/simcity.py" = "SimCity, small: one command lives the desk's whole day over all the saved data at the pretend broker with its faults and writes the night's one record, with the census of the money path's parts and the scenarios that ran them"
"desk/simcity_census.py" = "SimCity's census: each part of the money path and the scenarios that ran it, measured by a profiler"
"desk/simcity_incidents.py" = "SimCity's scenario of 23 November: a records.csv written before the FX columns is read, never refused, and the day goes on (R-RUNNER-482)"
"desk/simcity_parts.py" = "SimCity's night and its worlds: the night's one record with its words, a world's market dealt again from the saved lines, and the mishaps done to a desk's morning (shares behind its back, every line opening at its low, the kill switch pulled); desk.simcity gives them to its callers"
"desk/incidents/__init__.py" = "SimCity's incident registry: the one list of the scenarios a real night met, each its own module here, and the one lived once; simcity reads it and names none"
"desk/incidents/beside.py" = "SimCity incident beside: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/cancelled.py" = "SimCity incident cancelled: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/deaf.py" = "SimCity incident deaf: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/dropped.py" = "SimCity incident dropped: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/gateway_silent.py" = "SimCity incident gateway_silent: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/halted.py" = "SimCity incident halted: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/hole.py" = "SimCity incident hole: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/locked.py" = "SimCity incident locked: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/minutes.py" = "SimCity incident minutes: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/outside.py" = "SimCity incident outside: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/parked.py" = "SimCity incident parked: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/silent.py" = "SimCity incident silent: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/slow.py" = "SimCity incident slow: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/stale.py" = "SimCity incident stale: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/unbarred.py" = "SimCity incident unbarred: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/unheld.py" = "SimCity incident unheld: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/incidents/unreachable.py" = "SimCity incident unreachable: its title and the scenario that puts the desk in that morning with the promise it must keep"
"desk/simcity_faults.py" = "SimCity's broker fault matrix: every IBKR message class crossed with every send moment, each cell with the promise it must keep; a cell is a passing scene or listed as not yet built, counted and printed (R-RUNNER-392)"
"desk/simcity_fills.py" = "SimCity's trade-faithfulness replay: each real paper buy decided again from the bars saved before its day by the desk's own code, and a signal, size, stop or refusal that differs fails naming the fill and the field (R-RUNNER-409)"
"desk/simcitycmd.py" = "SimCity's command line: the saved store lived in a night of worlds (all with --full) as the runner asks, the night's words printed, the code 1 for a red night"
"desk/eponymous_breakouts.py" = "rules named for their authors, ported one at a time under the strategy template and judged on the ladder, never traded by the paper desk: Darvas's box"
"desk/incubation.py" = "an INCUBATE rule's buy on paper (R-RUNNER-232): GBP 250 a position, at most two open, on its own book line (strategy name begins inc_), through the one gate; never promoted by the ladder"
