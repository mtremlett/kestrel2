# THE DATA LANE'S MODULES - each with the one thing it owns. Only data lane
# branches edit this file, and only its module lines (tests/guards/test_lanes.py).
[modules]
"desk/lines.py" = "the instrument master: the facts about each line"
"desk/venues.py" = "the one calendar: the days each venue trades, its own holidays and no other's"
"desk/archive.py" = "the one client for the free price archive: a line's daily bars, checked on entry"
"desk/history.py" = "the one client for the broker's historical bars: a line's daily bars asked of the paper gateway read-only as its own client, paced inside the broker's limit, never in a desk round"
"desk/history_write.py" = "the broker's pulled bars let into the database: each answer of desk/history.py written through the one writer under the source IBKR, in a round of its own, a refusal adding nothing"
"desk/backfill.py" = "the filler of a missing daily bar for any named line and day: the broker first, the archive for what it does not give, each judged by the one store and written through its one writer only where none is held, a day neither gives named and never filled"
"desk/quality.py" = "the data quality monitor: each line's daily bars audited against the venue calendar and the store's own checks, every gap backfilled through desk/backfill.py, audited again, one line printed: green, or what stays red and why"
"desk/rollup.py" = "the one builder of the coarser intraday timeframes from the finest bars: session-aligned per venue, no bar across a session break, a partial interval never written, each bar marked rollup:<from>"
"desk/store.py" = "the one price store and its one writer: bars cleaned on entry, bad lines parked"
"desk/store_parts.py" = "what judges a line's neighbouring bars for the one store, split from desk/store.py: the bar and fault types, the limits of a move, and the pass that drops a bar or run out of line with its neighbours or keeps the move as a lasting fault"
"desk/bars.py" = "the one fast store for hot and deep bars: one SQLite file, the one writer's whole rounds, many readers"
"desk/bars_parts.py" = "what lets a five-minute bar into the fast store, split from desk/bars.py: each bar judged against its venue's calendar and the line's bars against one another and the closes held; a wait for the store's lock told as it was (StoreWait: waiter, database, seconds, holder unknown), never a retry"
"desk/bars_schema.py" = "what the fast store is made of, split from desk/bars.py: where a bar came from (Source), its tables and the statements that write and find rows in them"
"desk/bars_form.py" = "the one form a bar enters the fast store in, split from desk/bars.py: every price rounded once to a ten-thousandth and kept as that text, and the daily rows a write really changes, a held day corrected only when its prices or volume differ as numbers"
"desk/spans.py" = "the timeframes: one Span for each of 1m, 2m, 5m, 10m, 15m, 30m, 1h, 4h, 1d and 1wk with its length and start rule (a bar starts on a whole multiple of its length in UTC), and the bar types that refuse an off-mark start"
"desk/coverage.py" = "how much history the store holds for each line: sessions against twice the longest lookback, a score per line and for the desk, and the cap on the share of lines parked"
"desk/audit.py" = "the store's read-only audit: every line the two databases hold re-checked through the checks that let its bars in, counts and faults by kind in one line"
"desk/compare.py" = "how an old store's bars meet the bars the store holds: agreeing, the adjusted form of the raw as-traded bar (a factor, never written over it), or a real disagreement counted by day"
"desk/snapshot.py" = "the nightly backup copy: one consistent snapshot of each price database and the ledger in the data folder's backup folder, the last few kept"
"lab/universe.py" = "the research list: the tickers research may study, none of them traded, and their bars kept by the one store"
"lab/universe_parts.py" = "how research reads the list's bars, split from lab/universe.py: its rule for unconfirmed large moves, the longest run on one scale of price, and the second source of London's daily bars"
"lab/universe_history.py" = "the research bars in the history database: the research store's CSV bars and the ladder's pound table let in through the one writer, each bar under its source, only on days the database holds none"
"lab/members.py" = "the lists' past members: who was on a published list on a past day, the ones still listed told from the ones that left"
"lab/members_feed.py" = "the FTSE reviews read in: an announcement's joiners and leavers and the Wikipedia page's members either side of it (MediaWiki API), joined by members.reconcile, a disagreement named"
"desk/collector.py" = "the free collector: once a day the free vendors' price second opinions, macro series, earnings dates and timestamped news, each answer kept raw and its facts in the one store"
"desk/keeper.py" = "the store's keeper: one command that does whatever the store is owed when it is called, each venue's daily bars refreshed from the archive and its five-minute round taken in its hours, and the door the daily bars are read through"
"desk/store_scope.py" = "the keeper's judging scoped to the window the desk decides on: store.judge, but a fault dated before that window is named on its own day and never parks the line"
"desk/keeper_rotate.py" = "the keeper's record of a venue's last refresh, and the order it asks the broker in: the yardstick before all, then the lines not asked on the last call, so a line the broker refuses never starves the others"
"desk/keeper_receipt.py" = "the keeper's dated receipt: a file a day, a line for each call that did anything, saying which newest bars arrived, their span, moment and source, and surviving a kill between the line and the record of what was seen"
"desk/keeper_live.py" = "the keeper's live day: a venue's five-minute round from the paper gateway into the short database, and the archive's past days backfilled beneath it"
"desk/live.py" = "the live session's only source of bars: a line's newest ended five-minute bars from the paper gateway, read-only as its own client, paced; no real-time data is a loud refusal, never a fill from the archive"
"lab/headstart.py" = "the old desk's stores as a head start: its five-minute bars read, never written, and let into the one fast store under their source's name only where a fresh daily bar vouches for them"
"lab/headstart_parts.py" = "the head start's readers: each old store of five-minute bars, and the matrices' daily bars, read read-only into typed bars, a Stooq stamp put to UTC"
"lab/headstart_days.py" = "the old database's daily rows as a head start: only its table ohlcv's 1d rows, read-only, cleaned by the one store and let into the fast store under their own source on the days that hold no bar"
"lab/headstart_hours.py" = "the old Stooq store's hourly bars as a head start: read-only, each named by its start in UTC, vouched for by its day, cleaned by the one store and let into the history database under their own source"
"lab/headstart_matrix.py" = "the old Stooq matrices' 15-minute, 30-minute and hourly arrays as a head start: read-only, named by their start in UTC, vouched for by their day, cleaned by the one store and let into the two databases under their own source"
